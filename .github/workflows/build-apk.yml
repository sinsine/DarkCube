name: Build Android APK

# 手动触发，或推送 v* 标签时触发（自动上传 APK 到对应 Release）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21 # Capacitor 8 需要 Java 21

      # Actions 运行器已预装 Android SDK；这里确保许可证已接受
      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -f "$ANDROID_HOME/licenses/android-sdk-license" ]; then
            echo "licenses already accepted"
          else
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Install dependencies
        run: npm ci

      # 从 package.json 同步 Android 版本号，避免 APK 版本与发布版本不一致
      - name: Sync Android version
        run: node scripts/sync-android-version.mjs

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      # Windows 提交会丢失 gradlew 可执行位，构建前恢复
      - name: Fix gradlew permissions
        run: chmod +x android/gradlew

      # 从 Secrets 还原稳定签名，实现后续版本可覆盖安装
      - name: Prepare release signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.DARKCUBE_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.DARKCUBE_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.DARKCUBE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DARKCUBE_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/darkcube-release.keystore
            cat > android/keystore.properties <<EOF
            storeFile=darkcube-release.keystore
            storePassword=$STORE_PASS
            keyAlias=$KEY_ALIAS
            keyPassword=$KEY_PASS
            EOF
            echo "release keystore 已还原"
          else
            echo "未配置签名 Secrets，将使用 debug 签名"
          fi

      - name: Build APK (release)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Show APK version
        working-directory: android
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | tail -1)
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$APK" | grep -E "^package:" | head -2
          else
            echo "aapt2 not found"
          fi

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          NAME="DarkCubeDiary-${TAG}.apk"
          cp "$APK" "/tmp/$NAME"
          gh release upload "$TAG" "/tmp/$NAME" --clobber || \
            gh release create "$TAG" "/tmp/$NAME" --title "$TAG" --notes "Android APK 构建产物" --generate-notes

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: darkcube-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
