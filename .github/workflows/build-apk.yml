name: Build Android APK

# 手动触发，或推送 v* 标签时触发（自动上传 APK 到对应 Release）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Actions 运行器已预装 Android SDK；这里确保许可证已接受
      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -f "$ANDROID_HOME/licenses/android-sdk-license" ]; then
            echo "licenses already accepted"
          else
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          NAME="DarkCubeDiary-${TAG}.apk"
          cp "$APK" "/tmp/$NAME"
          gh release upload "$TAG" "/tmp/$NAME" --clobber || \
            gh release create "$TAG" "/tmp/$NAME" --title "$TAG" --notes "Android APK 构建产物" --generate-notes

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: darkcube-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
